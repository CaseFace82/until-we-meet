<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f7efe9'><link rel='manifest' href='manifest.json'><title>Until We Meet</title><style>
:root{--cream:#fbf7f2;--ink:#23333d;--rose:#d78386;--pink:#f7dedb;--sage:#dfe8dc;--blue:#e4edf0;--card:#fffdf9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff9f5,#f5eee8);color:var(--ink);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 96px}.script{font-family:Georgia,serif;font-style:italic;font-weight:400}.hero{text-align:center;padding:8px 6px 20px}.hero h1{font-family:Georgia,serif;font-size:36px;margin:2px}.hello{font-size:24px;font-style:italic}.count{margin-top:16px;letter-spacing:2px;font-size:13px}.days{font-family:Georgia,serif;font-size:48px}.sub{opacity:.68}.card{background:var(--card);border-radius:24px;padding:20px;margin:13px 0;box-shadow:0 5px 22px #5d45330d}.pink{background:var(--pink)}.sage{background:var(--sage)}.blue{background:var(--blue)}h2{font-size:21px;margin:0 0 10px}p{line-height:1.48;margin:6px 0}.big{font-size:23px;font-family:Georgia,serif}.tag{display:inline-block;background:#eef0ec;padding:5px 10px;border-radius:99px;font-size:12px;float:right}.heart{float:right;border:0;background:none;font-size:26px;color:var(--rose)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf9eF;backdrop-filter:blur(12px);border-top:1px solid #eee;display:flex;justify-content:center}.navin{width:520px;display:flex}.nav button{flex:1;padding:14px 4px 20px;border:0;background:none;color:#65727a}.nav button.active{color:#c75f68;font-weight:700}.entry{padding:15px;border-bottom:1px solid #eee;cursor:pointer}.entry b{display:block}.filters{display:flex;gap:8px}.filters button{border:0;border-radius:99px;padding:9px 14px}.filters .on{background:#d78386;color:white}.hidden{display:none}.paw{font-size:23px}.install{font-size:12px;text-align:center;opacity:.6;margin-top:20px}</style></head><body><main class='app'><section id='today'></section><section id='journey' class='hidden'></section></main><nav class='nav'><div class='navin'><button id='todayBtn' class='active'>♡<br>Today</button><button id='journeyBtn'>▤<br>Our Journey</button></div></nav><script>
const ANCHOR=new Date('2026-09-22T12:00:00'); const DUE=new Date('2027-04-15T12:00:00');
const affirm=["I can be gentle with myself today. My body is doing important work, even when I can't see it.","I don't need to have everything figured out. Today, I can simply take care of myself and our little one.","I can trust that small changes are still progress. I am allowed to move through today at my own pace.","I am growing into this new chapter one day at a time, and that is enough.","I can make room for excitement, uncertainty, rest, and joy—all of it belongs here.","My body deserves patience, kindness, and gratitude today.","I can listen to what I need today without having to earn the rest I take.","There is no perfect way to feel during pregnancy. I can meet today exactly as it comes.","Every ordinary day is quietly bringing us closer to meeting our baby.","I am surrounded by love as our family grows."];
const wisdom=["Rest is productive when your body is building something extraordinary.","You don't have to make every day memorable. Some of the sweetest chapters are made from ordinary days.","A growing family doesn't need perfection. It needs love, patience, and plenty of snacks.","There is plenty of time to become the parents you're going to be.","Some days call for plans. Some call for pajamas. Both count.","The future is arriving one very small day at a time.","You can be excited about what's ahead and still take today slowly.","The best parts of a family are often the little rituals nobody planned."];
const casey=["I love you. I'm so excited that we get to do this together.","Another day closer to meeting our little person. I can't imagine anyone I'd rather be doing this with.","I hope you know how loved you are—not because of anything you're accomplishing, just because you're you.","Thank you for everything your body is doing for our family. I'm right here with you.","I already love this little family of ours, and somehow we're making it even better.","Whatever kind of day today turns out to be, you've got me beside you.","I keep thinking about all the ordinary little family moments ahead of us. I can't wait.","I love watching this new chapter unfold with you. Even the weird parts.","You, me, Oliver, and one tiny new teammate. I really like where this is going.","If today's agenda becomes snacks and an early bedtime, I fully support the plan."];
const oliver=["I heard babies drop food on the floor. I fully support this parenting decision. — Oliver 🐾","I have reviewed the family expansion plans. My only question is whether the baby will share snacks. — Oliver 🐾","Dad says I'm getting a new best friend. I assume this person enjoys walks. — Oliver 🐾","I would like everyone to know I am available for nursery security. My rates are paid in treats. — Oliver 🐾","I heard the baby will eventually crawl. Finally, someone willing to hang out at my level. — Oliver 🐾","If the baby gets a blanket, I think we should order two. No reason. — Oliver 🐾","I am practicing being a big brother by supervising Mom very closely from the couch. — Oliver 🐾","Important baby advice: if food hits the floor, don't panic. I have a system. — Oliver 🐾","I heard there may be more naps around here. This project continues to exceed expectations. — Oliver 🐾","Just checking: the stroller has room for me too, correct? — Oliver 🐾"];
const sizes={10:'a small apricot',11:'a fig',12:'a lime',13:'a peach',14:'a lemon',15:'an apple',16:'an avocado',17:'a pear',18:'a bell pepper',19:'a mango',20:'a banana',21:'a carrot',22:'a papaya',23:'a grapefruit',24:'an ear of corn',25:'a rutabaga',26:'a zucchini',27:'a cauliflower',28:'an eggplant',29:'a butternut squash',30:'a cabbage',31:'a coconut',32:'a jicama',33:'a pineapple',34:'a cantaloupe',35:'a honeydew melon',36:'a head of romaine lettuce',37:'a bunch of Swiss chard',38:'a leek',39:'a small watermelon',40:'a small pumpkin'};
const dev={10:'Tiny fingers and toes are becoming more defined as development continues.',11:'The baby is moving and stretching, although those movements are still too small to feel.',12:'Facial features continue developing, and tiny fingernails are beginning to grow.',13:'The baby’s body is growing quickly as the second trimester approaches.',14:'Facial muscles and expressions continue to develop.',15:'Bones continue to strengthen as the baby grows.',16:'The baby’s movements are becoming more coordinated.',17:'The skeleton continues changing from soft cartilage toward bone.',18:'The ears are settling into position and hearing structures continue developing.',19:'A protective coating called vernix begins helping protect the skin.',20:'You are around the halfway point of a typical 40-week pregnancy.',21:'Movement and swallowing continue as the baby practices important skills.',22:'The senses continue developing, including touch and hearing.',23:'The lungs continue developing, though they still have a long way to go.',24:'The baby continues gaining weight while the lungs and nervous system mature.',25:'The baby responds more to sound and movement.',26:'The eyes continue developing and may begin opening.',27:'The brain and lungs continue a period of rapid development.',28:'The third trimester begins around this stage, with continued brain and body growth.',29:'The baby is adding body fat and continuing rapid brain development.',30:'The baby continues practicing breathing movements.',31:'The nervous system is increasingly able to help regulate body functions.',32:'The baby keeps gaining fat and practicing movements needed after birth.',33:'Bones are hardening, though the skull remains flexible for birth.',34:'The lungs and nervous system continue maturing.',35:'The baby continues putting on weight and preparing for life outside the womb.',36:'Many babies begin settling into a head-down position around this part of pregnancy.',37:'The pregnancy is considered early term beginning at 37 weeks.',38:'The baby continues adding fat and fine-tuning organ function.',39:'The baby is full term and continuing to prepare for birth.',40:'Forty weeks marks the traditional estimated length of pregnancy, though arrival dates naturally vary.'};
function dayNum(d=new Date()){return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(2026,8,22))/86400000)} function state(n){let total=70+n;return{week:Math.floor(total/7),wd:total%7}} function pick(a,n,s=0){return a[((n+s)%a.length+a.length)%a.length]} function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;')}
function dataFor(n){let s=state(n), fromOliver=(n%3===2), insight=(n%3===0);return{s,...s,size:sizes[s.week]||'growing every day',aff:pick(affirm,n,1),wis:pick(wis,n,3),note:fromOliver?pick(oliver,n,2):pick(casey,n,4),who:fromOliver?'Oliver':'Casey',insight:insight?dev[s.week]:null}}
function favs(){return JSON.parse(localStorage.getItem('uwmFavs')||'[]')} function toggle(n){let f=favs();f=f.includes(n)?f.filter(x=>x!==n):[...f,n];localStorage.setItem('uwmFavs',JSON.stringify(f));renderToday(currentDay);renderJourney()}
let currentDay=Math.max(0,dayNum());
function renderToday(n=dayNum()){currentDay=n;let x=dataFor(n), dt=new Date(2026,8,22+n), dueDays=Math.ceil((DUE-dt)/86400000), f=favs().includes(n);document.querySelector('#today').innerHTML=`<div class='hero'><div class='hello'>Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'},</div><h1>Christina ♡</h1><div class='count'>WE MEET IN</div><div class='days'>${Math.max(0,dueDays)} days</div><div class='sub'>Estimated due date · April 15, 2027</div></div><div class='card'><button class='heart' onclick='toggle(${n})'>${f?'♥':'♡'}</button><span class='tag'>Week ${x.week}</span><h2>${x.week} weeks + ${x.wd} days</h2><div class='sub'>${dt.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><p class='big'>Baby is about the size of <b>${x.size}</b>.</p>${x.insight?`<p>${x.insight}</p>`:''}</div><div class='card pink'><h2>♡ Today’s Affirmation</h2><p class='script'>“${x.aff}”</p></div><div class='card sage'><h2>☀ A Little Wisdom</h2><p>${x.wis}</p></div><div class='card ${x.who==='Oliver'?'blue':'pink'}'><h2>${x.who==='Oliver'?'🐾':'♥'} From ${x.who}</h2><p>${x.note}</p></div>${n!==dayNum()?`<div class='install'>Viewing a previous day · <a href='#' onclick='renderToday(dayNum());return false'>Back to today</a></div>`:`<div class='install'>Until We Meet · Made with love for Christina</div>`}`}
let favOnly=false;function renderJourney(){let now=Math.max(0,dayNum()), fs=favs(), rows='';for(let n=now;n>=0;n--){if(favOnly&&!fs.includes(n))continue;let x=dataFor(n),dt=new Date(2026,8,22+n);rows+=`<div class='entry' onclick='showDay(${n})'><span style='float:right;color:#c75f68'>${fs.includes(n)?'♥':'♡'}</span><b>${dt.toLocaleDateString(undefined,{month:'long',day:'numeric'})} · ${x.week}w${x.wd}d</b><span>${x.who==='Oliver'?'🐾':'♥'} ${x.who} · Baby about the size of ${x.size}</span></div>`}document.querySelector('#journey').innerHTML=`<div class='hero'><h1>Our Journey</h1><p class='sub'>A look back at the little moments along the way.</p></div><div class='filters'><button class='${!favOnly?'on':''}' onclick='favOnly=false;renderJourney()'>All Days</button><button class='${favOnly?'on':''}' onclick='favOnly=true;renderJourney()'>♥ Favorites</button></div><div class='card' style='padding:4px 16px'>${rows||'<p>No favorites yet.</p>'}</div>`} function showDay(n){document.querySelector('#journey').classList.add('hidden');document.querySelector('#today').classList.remove('hidden');todayBtn.classList.add('active');journeyBtn.classList.remove('active');renderToday(n);scrollTo(0,0)}
todayBtn.onclick=()=>showDay(dayNum());journeyBtn.onclick=()=>{document.querySelector('#today').classList.add('hidden');document.querySelector('#journey').classList.remove('hidden');journeyBtn.classList.add('active');todayBtn.classList.remove('active');renderJourney();scrollTo(0,0)};renderToday();renderJourney();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
